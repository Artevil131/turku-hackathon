# Typecheck, lint and tests on every push and pull request. The organisers'
# dataset is not in git, so tests that need it skip here; run
# `pnpm test` and `uv run python scripts/verify_experiments.py` locally for those.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test
