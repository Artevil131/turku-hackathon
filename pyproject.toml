[project]
name = "aei-analysis"
version = "0.0.0"
description = "Data analysis for the AEI challenge (D-024): experiments, scripts and cross-checks in Python"
requires-python = ">=3.12"
dependencies = [
  "aei",
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.workspace]
members = ["libs/utils/py"]

[tool.uv.sources]
aei = { workspace = true }
